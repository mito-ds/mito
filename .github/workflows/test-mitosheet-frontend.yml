name: Test - mitosheet frontend

on:
  push:
    branches: [ dev ]
    paths:
      - 'mitosheet/**'
      - 'tests/**'
      - '.github/workflows/test-mitosheet-frontend.yml'
      - '!tests/mitoai_ui_tests/**'
  pull_request:
    paths:
      - 'mitosheet/**'
      - 'tests/**'
      - '.github/workflows/test-mitosheet-frontend.yml'
      - '!tests/mitoai_ui_tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-mitosheet-frontend-jupyterlab:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          mitosheet/setup.py
          tests/requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: mitosheet/package-lock.json
    - name: Install dependencies
      run: |
        cd tests
        bash mac-setup.sh
    - name: Setup JupyterLab
      run: |
        cd tests
        source venv/bin/activate
        cd ../mitosheet
        jupyter labextension develop . --overwrite
    - name: Start a server and run tests
      run: |
        cd tests
        source venv/bin/activate
        jupyter lab --config jupyter_server_test_config.py &
        npm run test:jupyterlab
    - name: Upload test-results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: jupyterlab-playwright-report-${{ matrix.python-version }}-${{ github.run_id }}
        path: tests/playwright-report/
        retention-days: 14

  test-mitosheet-frontend-jupyternotebook:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          mitosheet/setup.py
          tests/requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: mitosheet/package-lock.json
    - name: Install dependencies
      run: |
        cd tests
        bash mac-setup.sh
    - name: Setup Jupyter notebook
      run: |
        cd tests
        source venv/bin/activate
        cd ../mitosheet
        jupyter labextension develop . --overwrite
    - name: Start a server and run tests
      run: |
        cd tests
        source venv/bin/activate
        jupyter notebook --config jupyter_notebook_config.py &
        npm run test:notebook
    - name: Upload test-results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: jupyternotebook-playwright-report-${{ matrix.python-version }}-${{ github.run_id }}
        path: tests/playwright-report/
        retention-days: 14

  test-mitosheet-frontend-streamlit:
    runs-on: ubuntu-latest-m
    timeout-minutes: 60
    strategy:
      matrix:
        testfiles: ['taskpanes', 'grid', 'toolbar', 'graph']
      fail-fast: false
    name: Test ${{ matrix.testfiles }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: |
          mitosheet/setup.py
          tests/requirements.txt
          tests/extra-requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: mitosheet/package-lock.json
    - name: Install dependencies
      run: |
        cd tests
        bash mac-setup.sh chromium
        source venv/bin/activate
        pip install -r extra-requirements.txt
    - name: Setup streamlit
      run: |
        mkdir -p ~/.streamlit/
        echo "[general]"  > ~/.streamlit/credentials.toml
        echo "email = \"\""  >> ~/.streamlit/credentials.toml
    - name: Start a server and run tests
      run: |
        cd tests
        source venv/bin/activate
        streamlit run streamlit_test.py --server.port 8555 &
        bash check_server.sh
        npm run test -- --project=chromium --retries=1 streamlit_ui_tests/${{matrix.testfiles}}
    - name: Upload test-results
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{matrix.testfiles}}
        path: tests/playwright-report/
        retention-days: 14

  test-mitosheet-frontend-dash:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: |
          mitosheet/setup.py
          tests/requirements.txt
          tests/extra-requirements.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: mitosheet/package-lock.json
    - name: Install dependencies
      run: |
        cd tests
        bash mac-setup.sh
        source venv/bin/activate
        pip install -r extra-requirements.txt
    - name: Start a server and run tests
      run: |
        cd tests
        source venv/bin/activate
        python dash-test.py &
        npm run test:dash

  test-mitosheet-jest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: mitosheet/package-lock.json
    - name: Install dependencies
      working-directory: mitosheet
      run: |
        npm install
    - name: Run Jest tests
      working-directory: mitosheet
      run: |
        npm run test